server:
  port: 8081

# Loguri cache: INFO = backend la pornire + aspect wired; DEBUG = HIT/MISS/PUT/EVICT per request
logging:
  level:
    com.impact.lessons.cache: DEBUG

impact:
  cache:
    # memory = JVM (fără Redis) | redis = Memurai/Redis (spring.data.redis)
    type: redis

spring:
  application:
    name: lessons

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/TestTest
    username: postgres
    password: 1234567890

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: always

jwt:
  secret: "a3d9c8a8f6e2b1e4a9d7c8b3a0f9e8d5c4b1a3f9e8d5c4b1a3f9e8d5c4b1a3f9e8d5c4b1a3f9e8d5c4b1a3f9e8d5c4b1a3f9e8d5c4b1" # Secret puternic și lung pentru semnarea token-urilor JWT.
  expiration: 86400000 # Timpul de expirare al token-ului în milisecunde (24 de ore).
  refresh:
    expiration: 604800000 # 7 days

# Swagger UI (springdoc-openapi)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
