databaseChangeLog:
  - changeSet:
      id: create-roles-table-if-missing
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: create-user-roles-table-if-missing
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: user_roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: role_id, user_id
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user

  - changeSet:
      id: relax-legacy-users-columns
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: users
          - columnExists:
              tableName: users
              columnName: role
          - columnExists:
              tableName: users
              columnName: enabled
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: role
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: users
            columnName: enabled
            columnDataType: BOOLEAN

  - changeSet:
      id: seed-default-admin-user
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: users
          - tableExists:
              tableName: roles
          - tableExists:
              tableName: user_roles
      changes:
        - sql:
            sql: |
              INSERT INTO roles(name)
              SELECT 'ROLE_ADMIN'
              WHERE NOT EXISTS (
                SELECT 1 FROM roles WHERE name = 'ROLE_ADMIN'
              );

              INSERT INTO users(username, email, password)
              SELECT 'admin', 'admin@impact.local', '$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy'
              WHERE NOT EXISTS (
                SELECT 1 FROM users WHERE username = 'admin'
              );

              INSERT INTO user_roles(user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'ROLE_ADMIN'
              WHERE u.username = 'admin'
                AND NOT EXISTS (
                  SELECT 1
                  FROM user_roles ur
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                );

  - changeSet:
      id: sync-default-admin-credentials
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: users
      changes:
        - sql:
            sql: |
              UPDATE users
              SET email = 'admin@impact.local',
                  password = '$2a$10$OtPkOFkW9ClvDFfcLVoM..yAVnAlGphPBysBGFIAKMFYLVNFYdLwu'
              WHERE username = 'admin';
